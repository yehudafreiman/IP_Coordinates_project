apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage-api
  labels:
    app: storage-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storage-api
  template:
    metadata:
      labels:
        app: storage-api
    spec:
      containers:
      - name: api-b
        # This image must be pushed to Docker Hub
        # Build: docker build -t user-api:1.0 ./api
        # Tag: docker tag user-api:1.0 <your-dockerhub-username>/user-api:1.0
        # Push: docker push <your-dockerhub-username>/user-api:1.0
        # Then update this line to: image: <your-dockerhub-username>/user-api:1.0
        image: yehudafreiman/storage-api:3.0
        imagePullPolicy: Always
        ports:
        - containerPort: 8001
        env:
          - name: REDIS_HOST
            value: "redis-headless"
          - name: REDIS_PORT
            value: "6379"

