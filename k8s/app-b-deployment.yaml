apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage-api
  labels:
    app: storage-api
spec:
  replicas: 1
  
  selector:
    matchLabels:
      app: storage-api
  
  template:
    metadata:
      labels:
        app: storage-api
    spec:
      containers:
      - name: container-service-b
        image: israelyarbloom/storage-api:v1
        
        ports:
        - containerPort: 8001

        imagePullPolicy: Always

        env:
        - name: SERVICE_B_URL
          value: "http://storage-api:8001"