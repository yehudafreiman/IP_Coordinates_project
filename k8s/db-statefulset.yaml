apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app: postgres
    tier: database
spec:
  # Links to headless Service for stable DNS
  serviceName: postgres-headless

  # Number of database replicas
  replicas: 2

  # Selector must match pod template labels
  selector:
    matchLabels:
      app: postgres

  # Pod template
  template:
    metadata:
      labels:
        app: postgres
        tier: database
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
          name: postgres

        # Environment variables for PostgreSQL configuration
        env:
        - name: POSTGRES_DB
          value: "appdb"
        - name: POSTGRES_USER
          value: "appuser"
        - name: POSTGRES_PASSWORD
          value: "apppass123"
        - name: PGDATA
          value: "/var/lib/postgresql/data/pgdata"

        # Mount persistent storage
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data

        # Resource limits for production readiness
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"

        # Liveness probe - restart if PostgreSQL is unresponsive
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - appuser
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        # Readiness probe - don't send traffic until ready
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - appuser
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

  # VolumeClaimTemplates - creates one PVC per pod automatically
  # PVC names: postgres-storage-postgres-0, postgres-storage-postgres-1
  volumeClaimTemplates:
  - metadata:
      name: postgres-storage
      labels:
        app: postgres
    spec:
      # ReadWriteOnce - only one pod can write to this volume
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi
