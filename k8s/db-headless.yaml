apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  labels:
    app: postgres
    tier: database
spec:
  # Headless Service - creates DNS records for individual pods
  # No load balancing - each pod gets its own DNS name
  clusterIP: None
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
    name: postgres
    protocol: TCP
